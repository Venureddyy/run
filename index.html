<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Tesla Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body.light{--bg:#e8e8e8;--cluster:#ebebeb;--text:#1a1a1a;--subtext:#9a9a9a;--divider:rgba(0,0,0,0.08);--btn-bg:rgba(0,0,0,0.04);--btn-border:rgba(0,0,0,0.12);--sp-bg:#fff;--sp-card:rgba(0,0,0,0.04);--range-bg:rgba(0,0,0,0.1)}
body.dark{--bg:#0a0a0a;--cluster:#111;--text:#f0f0f0;--subtext:#555;--divider:rgba(255,255,255,0.06);--btn-bg:rgba(255,255,255,0.06);--btn-border:rgba(255,255,255,0.1);--sp-bg:#121212;--sp-card:rgba(255,255,255,0.06);--range-bg:rgba(255,255,255,0.1)}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;transition:background 0.4s}
#shell{width:100vw;height:100dvh;display:grid;grid-template-columns:420px 1fr}

/* CLUSTER */
#cluster{background:var(--cluster);display:flex;flex-direction:column;height:100dvh;overflow:hidden;border-right:1px solid var(--divider);transition:background 0.3s;position:relative}
.cl-top{display:flex;align-items:center;padding:10px 12px 6px;gap:5px;flex-shrink:0}
.cl-top-temp{font-weight:600;font-size:15px;color:var(--text)}
.cl-top-time{font-weight:600;font-size:15px;color:var(--text);margin-left:auto}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,123,228,0.3);background:rgba(0,123,228,0.06);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.icon-btn:hover{background:rgba(0,123,228,0.16);border-color:#007BE4}
.icon-btn svg{width:14px;height:14px;stroke:#007BE4;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.active{background:rgba(0,123,228,0.22);border-color:#007BE4}
.icon-sun{display:block}.icon-moon{display:none}
body.dark .icon-sun{display:none}body.dark .icon-moon{display:block}
.cl-speed-block{padding:0 16px;flex-shrink:0}
.cl-speed-num{font-family:'Inter',sans-serif;font-weight:300;font-size:120px;line-height:0.9;letter-spacing:-6px;color:var(--text);transition:color 0.5s;display:block}
.cl-speed-num.danger{color:#d32f2f}
.cl-speed-unit{font-size:10px;font-weight:600;letter-spacing:4px;color:var(--text);text-transform:uppercase;margin-top:2px}
.cl-data{padding:4px 16px 6px;flex-shrink:0}
.cl-data-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cl-data-label{font-size:12px;font-weight:600;color:var(--text)}
.cl-data-val{font-family:'Inter',sans-serif;font-weight:600;font-size:16px;color:var(--text)}
.cl-divider{width:100%;height:1px;background:var(--divider);flex-shrink:0}
.cl-steering{display:flex;justify-content:center;padding:5px 0 3px;flex-shrink:0}
#roadWrap{flex:1;min-height:0;position:relative;overflow:hidden}
#roadCanvas{position:absolute;inset:0;width:100%;height:100%}

/* SPOTIFY PANEL */
#spotPanel{display:flex;flex-direction:column;height:100dvh;background:var(--sp-bg);overflow:hidden;transition:background 0.4s}

/* Login screen */
#spotLogin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px}
.sp-logo{width:72px;height:72px}
.sp-login-title{font-size:22px;font-weight:700;color:var(--text);text-align:center}
.sp-login-sub{font-size:14px;color:var(--subtext);text-align:center}
.sp-connect-btn{background:#1db954;border:none;border-radius:50px;color:#fff;padding:16px 48px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:0.5px;transition:transform 0.1s,background 0.2s}
.sp-connect-btn:hover{background:#1ed760;transform:scale(1.02)}
.sp-connect-btn:active{transform:scale(0.98)}

/* Player */
#spotPlayer{display:none;flex-direction:column;height:100dvh;overflow:hidden}

/* Now playing bar */
.sp-nowplaying{display:flex;align-items:center;gap:0;padding:0;background:var(--sp-bg);border-bottom:1px solid var(--divider);flex-shrink:0;height:88px}
.sp-art{width:88px;height:88px;border-radius:0;object-fit:cover;background:var(--btn-bg);flex-shrink:0;}
.sp-np-info{flex:1;min-width:0}
.sp-np-track{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-np-artist{font-size:12px;color:var(--subtext);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-np-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sp-ctrl-btn{background:none;border:none;cursor:pointer;color:var(--subtext);display:flex;align-items:center;justify-content:center;transition:color 0.2s;padding:4px}
.sp-ctrl-btn:hover{color:var(--text)}
.sp-play-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--text);background:transparent;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.sp-play-btn:hover{background:var(--btn-bg)}

/* Progress */
.sp-progress{padding:8px 20px 4px;flex-shrink:0}
.sp-prog-bar{width:100%;height:2px;background:var(--range-bg);border-radius:0;cursor:pointer}
.sp-prog-fill{height:100%;border-radius:0;background:#1db954;transition:width 0.8s linear}
.sp-prog-times{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--subtext);font-family:'Inter',sans-serif}

/* Search */
.sp-search{padding:10px 16px 8px;flex-shrink:0}
.sp-search-box{display:flex;align-items:center;gap:10px;background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:24px;padding:0 14px;height:38px}
.sp-search-box input{border:none;background:transparent;outline:none;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);flex:1}
.sp-search-box input::placeholder{color:var(--subtext)}
.sp-search-box svg{stroke:var(--subtext);flex-shrink:0;width:15px;height:15px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* Content area */
.sp-content{flex:1;overflow-y:auto;padding:10px 16px 16px;scrollbar-width:thin;scrollbar-color:var(--divider) transparent}
.sp-content::-webkit-scrollbar{width:4px}
.sp-content::-webkit-scrollbar-thumb{background:var(--divider);border-radius:2px}
.sp-section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--subtext);margin:16px 0 10px;padding-left:2px;cursor:default;text-align:center;}
/* Tesla-style art grid */
.sp-art-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.sp-art-card{cursor:pointer;transition:opacity 0.15s;aspect-ratio:1;overflow:hidden;}
.sp-art-card:hover{opacity:0.75}
.sp-art-card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--btn-bg);border-radius:0;}
.sp-art-card .sp-card-name{display:none}
.sp-art-card .sp-card-sub{display:none}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:20px}
.sp-card{background:var(--sp-card);border-radius:10px;padding:10px;cursor:pointer;transition:background 0.2s}
.sp-card:hover{background:var(--btn-bg)}
.sp-card img{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;background:var(--btn-bg);display:block;margin-bottom:8px}
.sp-card-name{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-card-sub{font-size:10px;color:var(--subtext);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-list{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.sp-list-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background 0.15s}
.sp-list-item:hover{background:var(--sp-card)}
.sp-list-item img{width:42px;height:42px;border-radius:4px;object-fit:cover;background:var(--btn-bg);flex-shrink:0}
.sp-list-info{flex:1;min-width:0}
.sp-list-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-list-sub{font-size:11px;color:var(--subtext);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-list-dur{font-size:11px;color:var(--subtext);flex-shrink:0;font-family:'Inter',sans-serif}
.sp-empty{text-align:center;padding:40px 20px;color:var(--subtext);font-size:14px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:3000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--cluster);border:1px solid var(--divider);border-radius:20px;padding:26px;min-width:280px}
.modal-title{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--subtext);margin-bottom:16px}
.modal-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--text);font-size:22px;font-family:'Inter',sans-serif;font-weight:200;text-align:center;outline:none;margin-bottom:14px}
.modal-input:focus{border-color:#4caf50}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--btn-border);background:transparent;color:var(--subtext);cursor:pointer;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:500}
.modal-btn.ok{background:#4caf50;border-color:#4caf50;color:#fff}
/* Fullscreen now playing */
#spFs{
  display:none;position:absolute;inset:0;z-index:9999;
  flex-direction:column;align-items:center;justify-content:space-evenly;
  padding:50px 28px 32px;overflow:hidden;
  background:var(--sp-bg);
}
#spFs.open{display:flex}
#spFs .fs-close{position:absolute;top:14px;right:16px;background:none;border:none;
  color:var(--subtext);font-size:24px;cursor:pointer;padding:6px 10px;line-height:1}
#spFs .fs-art{width:160px;height:160px;border-radius:12px;object-fit:cover;flex-shrink:0;
  box-shadow:0 8px 32px rgba(0,0,0,0.3)}
#spFs .fs-track{font-size:18px;font-weight:700;color:var(--text);text-align:center;
  width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spFs .fs-artist{font-size:13px;color:var(--subtext);text-align:center;width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spFs .fs-prog-wrap{width:100%}
#spFs .fs-bar{width:100%;height:4px;background:rgba(128,128,128,0.3);
  border-radius:2px;cursor:pointer;margin-bottom:6px}
#spFs .fs-fill{height:100%;border-radius:2px;background:#1db954;transition:width 0.4s linear}
#spFs .fs-times{display:flex;justify-content:space-between;
  font-size:10px;color:var(--subtext);font-family:'Inter',sans-serif}
#spFs .fs-ctrls{display:flex;align-items:center;gap:28px}
#spFs .fs-btn{background:none;border:none;cursor:pointer;color:var(--subtext);
  display:flex;align-items:center;justify-content:center}
#spFs .fs-play{width:56px;height:56px;border-radius:50%;border:2px solid var(--text);
  background:transparent;cursor:pointer;color:var(--text);
  display:flex;align-items:center;justify-content:center}
</style>
</head>
<body class="light">
<div id="shell">

<!-- CLUSTER -->
<div id="cluster">
  <div class="cl-top">
    <span class="cl-top-temp" id="clTemp">-- °C</span>
    <button class="icon-btn" onclick="openModal('odo')" title="Set ODO"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></button>
    <button class="icon-btn" onclick="resetTrip()" title="Reset Trip"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="icon-btn theme-btn" onclick="toggleTheme()" title="Theme"><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <button class="icon-btn" onclick="toggleFS()" title="Fullscreen"><svg id="fsIco" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button class="icon-btn" id="demoBtn" onclick="toggleDemo()" title="Demo"><svg viewBox="0 0 24 24" fill="#007BE4" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
    <span class="cl-top-time" id="clTime">--:--</span>
  </div>
  <div class="cl-speed-block">
    <span class="cl-speed-num" id="spdNum">0</span>
    <div class="cl-speed-unit">MPH</div>
  </div>
  <div class="cl-data">
    <div class="cl-data-row"><span class="cl-data-label">Trip</span><span class="cl-data-val" id="tripVal">0.0 mi</span></div>
    <div class="cl-data-row"><span class="cl-data-label">ODO</span><span class="cl-data-val" id="odoVal">-- mi</span></div>
  </div>
  <div class="cl-divider"></div>
  <div class="cl-steering">
    <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M46 24C46 36.1501 36.1501 46 24 46C11.8499 46 2 36.1501 2 24C2 11.8499 11.8499 2 24 2C36.1501 2 46 11.8499 46 24ZM6.24927 27.0017C15.9578 27.1345 20.4526 35.0271 20.9526 41.7432C13.438 40.4619 7.51172 34.5227 6.24927 27.0017ZM6.10986 22H10.5C12.2219 22 13.666 21.4441 15.3108 20.8108C17.4866 19.9729 20.0134 19 24 19C27.9866 19 30.5134 19.9729 32.6892 20.8108C34.334 21.4441 35.7781 22 37.5 22H41.8901C40.8953 13 33.2651 6 24 6C14.7349 6 7.10474 13 6.10986 22ZM27.0474 41.7432C27.5474 35.0271 32.0422 27.1345 41.7507 27.0017C40.4883 34.5227 34.562 40.4619 27.0474 41.7432Z" fill="#007BE4"/></svg>
  </div>
  <div id="roadWrap"><canvas id="roadCanvas"></canvas></div>
</div>

<!-- SPOTIFY PANEL -->
<div id="spotPanel" style="position:relative;">

  <!-- LOGIN -->
  <div id="spotLogin">
    <svg class="sp-logo" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="#1db954"/>
      <path d="M8 12.5c2.5-1.5 6-1.5 8 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M7 9.5c3.5-2 8-2 10 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M9 15.5c2-1 5-1 6.5 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div class="sp-login-title">Spotify</div>
    <div class="sp-login-sub">Connect to stream music while you drive</div>
    <button class="sp-connect-btn" onclick="spotifyLogin()">Connect with Spotify</button>
  </div>

  <!-- PLAYER -->
  <div id="spotPlayer">

    <!-- Now playing -->
    <div class="sp-nowplaying">
      <div onclick="openFs()" style="display:flex;align-items:center;gap:0;flex:1;min-width:0;cursor:pointer;overflow:hidden;">
        <img id="spArt" class="sp-art" src="" alt="">
        <div class="sp-np-info" style="padding:0 14px;">
          <div class="sp-np-track" id="spTrack">Nothing playing</div>
          <div class="sp-np-artist" id="spArtist">--</div>
          <div id="spAlbum" style="font-size:11px;color:var(--subtext);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
        </div>
      </div>
      <div class="sp-np-controls" style="flex-shrink:0;gap:6px;">
        <button class="sp-ctrl-btn" onclick="spPrev()"><svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="sp-play-btn" onclick="spToggle()"><svg id="spPlayIco" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="sp-ctrl-btn" onclick="spNext()"><svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></button>
        <button class="sp-ctrl-btn" onclick="document.getElementById('spSearchInp').focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
        <button class="sp-ctrl-btn" onclick="loadTopTracks()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      </div>
    </div>

    <!-- Progress -->
    <div class="sp-progress">
      <div class="sp-prog-bar"><div class="sp-prog-fill" id="spProgFill" style="width:0%"></div></div>
      <div class="sp-prog-times"><span id="spPos">0:00</span><span id="spDur">0:00</span></div>
    </div>

    <!-- Search -->
    <div class="sp-search">
      <div class="sp-search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="spSearchInp" type="text" placeholder="Search songs, artists, albums…" onkeydown="if(event.key==='Enter')spSearch()">
      </div>
    </div>

    <!-- Content grid -->
    <div class="sp-content" id="spContent">
      <div class="sp-empty">Search for music above<br>or start playing on Spotify</div>
    </div>

    <!-- Fullscreen — inside spotPlayer, guaranteed on top of list -->
    <div id="spFs">
      <button class="fs-close" onclick="closeFs()">✕</button>
      <img class="fs-art" id="fsArt" src="" alt="">
      <div class="fs-track" id="fsTrack">--</div>
      <div class="fs-artist" id="fsArtist">--</div>
      <div class="fs-prog-wrap">
        <div class="fs-bar" onclick="fsScrub(event,this)">
          <div class="fs-fill" id="fsFill" style="width:0%"></div>
        </div>
        <div class="fs-times"><span id="fsPos">0:00</span><span id="fsDur">0:00</span></div>
      </div>
      <div class="fs-ctrls">
        <button class="fs-btn" onclick="spPrev()"><svg viewBox="0 0 24 24" fill="currentColor" width="30" height="30"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="fs-play" onclick="spToggle()"><svg id="spFsIco" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="fs-btn" onclick="spNext()"><svg viewBox="0 0 24 24" fill="currentColor" width="30" height="30"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></button>
      </div>
    </div>

  </div>

</div><!-- /spotPanel -->
</div><!-- /shell -->

<!-- MODAL -->
<div class="modal-overlay" id="odoModal">
  <div class="modal-box">
    <div class="modal-title">Set Odometer</div>
    <input class="modal-input" type="number" id="odoInp" placeholder="e.g. 25145" min="0">
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal('odo')">Cancel</button>
      <button class="modal-btn ok" onclick="confirmOdo()">Set</button>
    </div>
  </div>
</div>

<script>
const SPOT_CLIENT='9ccf3c3270234334b3c74317f5ebd466';
const SPOT_REDIRECT='https://venureddyy.github.io/run/';
const SPOT_SCOPES='streaming user-read-playback-state user-modify-playback-state user-read-currently-playing user-library-read user-top-read user-read-recently-played user-follow-read playlist-read-private playlist-read-collaborative';
const S={targetSpd:0,prevSpd:0,dispSpd:0,trip:0,odo:null,lat:null,lon:null,lastLat:null,lastLon:null,tempFetched:false,spotToken:null,spotPlaying:false,spotDur:0,spotPos:0};

// Clock
function tickClock(){const n=new Date();document.getElementById('clTime').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
tickClock();setInterval(tickClock,10000);

// Temp
async function fetchTemp(lat,lon){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);const d=await r.json();document.getElementById('clTemp').textContent=Math.round(d.current_weather.temperature)+' °C';}catch(e){}}

function hav(la1,lo1,la2,lo2){const R=3958.8,r=d=>d*Math.PI/180;const a=Math.sin(r(la2-la1)/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(r(lo2-lo1)/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function showSpd(s){const el=document.getElementById('spdNum');if(el){el.textContent=s;el.classList.toggle('danger',s>70);}}

// GPS
let _lt=null;
function onGPS(pos){
  const{latitude:lat,longitude:lon,speed}=pos.coords;const now=Date.now();
  let mph=0;
  if(speed!=null&&speed>=0)mph=speed*2.23694;
  else if(S.lastLat!==null&&_lt!==null){const dt=(now-_lt)/3600000;if(dt>0&&dt<0.02)mph=hav(S.lastLat,S.lastLon,lat,lon)/dt;}
  _lt=now;S.prevSpd=S.targetSpd;S.targetSpd=Math.max(0,Math.round(mph));S.dispSpd=S.targetSpd;showSpd(S.targetSpd);
  S.lat=lat;S.lon=lon;if(!S.tempFetched){fetchTemp(lat,lon);S.tempFetched=true;}
  if(S.lastLat!==null){const d=hav(S.lastLat,S.lastLon,lat,lon);if(d>=0&&d<0.5){S.trip+=d;if(S.odo!==null)S.odo+=d;}}
  S.lastLat=lat;S.lastLon=lon;refreshUI();
}
function refreshUI(){const tv=document.getElementById('tripVal');if(tv)tv.textContent=S.trip.toFixed(1)+' mi';const ov=document.getElementById('odoVal');if(S.odo!==null&&ov)ov.textContent=Math.round(S.odo)+' mi';}

// ── SPOTIFY PKCE ──
async function sha256(v){const e=new TextEncoder().encode(v);const h=await crypto.subtle.digest('SHA-256',e);return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function rnd(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}

async function spotifyLogin(){
  // Clear old tokens to force re-auth with new scopes
  const t=localStorage.getItem('sp_tok'),e=localStorage.getItem('sp_tok_exp');
  const scopes=localStorage.getItem('sp_scopes');
  if(t&&e&&Date.now()<parseInt(e)&&scopes===SPOT_SCOPES){S.spotToken=t;initSpot();return;}
  // Scopes changed or expired — clear and re-auth
  localStorage.removeItem('sp_tok');localStorage.removeItem('sp_tok_exp');
  const v=rnd(32),c=await sha256(v);localStorage.setItem('sp_v',v);
  const u=new URL('https://accounts.spotify.com/authorize');
  u.searchParams.set('client_id',SPOT_CLIENT);u.searchParams.set('response_type','code');
  u.searchParams.set('redirect_uri',SPOT_REDIRECT);u.searchParams.set('scope',SPOT_SCOPES);
  u.searchParams.set('code_challenge_method','S256');u.searchParams.set('code_challenge',c);
  location.href=u.toString();
}

async function handleCb(code){
  const v=localStorage.getItem('sp_v');if(!v)return;
  try{
    const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:SPOT_REDIRECT,client_id:SPOT_CLIENT,code_verifier:v})});
    const d=await r.json();
    if(d.access_token){
      localStorage.setItem('sp_tok',d.access_token);
      localStorage.setItem('sp_tok_exp',Date.now()+d.expires_in*1000);
      localStorage.setItem('sp_scopes',SPOT_SCOPES);
      localStorage.setItem('sp_ver','v4');
      if(d.refresh_token)localStorage.setItem('sp_ref',d.refresh_token);
      localStorage.removeItem('sp_v');
      history.replaceState({},document.title,location.pathname);
      S.spotToken=d.access_token;initSpot();
    }
  }catch(e){console.error('Spotify auth error',e);}
}

function initSpot(){
  document.getElementById('spotLogin').style.display='none';
  const p=document.getElementById('spotPlayer');p.style.display='flex';p.style.flexDirection='column';p.style.height='100%';p.style.position='relative';
  pollSpot();loadTopTracks();
  // Poll every 1s for accurate sync
  setInterval(pollSpot,1000);
}

async function spFetch(ep,method='GET',body=null){
  const opts={method,headers:{'Authorization':'Bearer '+S.spotToken,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  try{
    const r=await fetch('https://api.spotify.com/v1'+ep,opts);
    if(r.status===204||r.status===202)return null;
    if(!r.ok){const e=await r.json().catch(()=>({}));console.warn('spFetch error',r.status,ep,JSON.stringify(e));return null;}
    return await r.json();
  }catch(e){console.error('spFetch exception',ep,e);return null;}
}

function fmtMs(ms){if(!ms)return'0:00';const s=Math.floor(ms/1000),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}

async function pollSpot(){
  const d=await spFetch('/me/player');if(!d)return;
  S.spotPlaying=d.is_playing;
  S.spotDur=d.item?.duration_ms||0;
  S.spotPos=d.progress_ms||0;
  S._pollTime=Date.now();
  const it=d.item;
  if(it){
    // Only update UI if track changed — avoids unnecessary redraws and flashing
    if(it.id!==S._currentTrackId){
      S._currentTrackId=it.id;
      const name=it.name||'--';
      const artist=it.artists?.map(a=>a.name).join(', ')||'--';
      const art=it.album?.images?.[0]?.url||'';
      setEl('spTrack',name);setEl('spArtist',artist);
      setEl('fsTrack',name);setEl('fsArtist',artist);
      if(art){
        setSrc('spArt',art);setSrc('fsArt',art);
        // Only apply tint on track change, not every poll
        if(document.getElementById('spFs').classList.contains('open'))applyArtTint(art);
      }
    }
  }
  // Only update play/pause icon if state changed
  if(S.spotPlaying!==S._lastPlaying){
    S._lastPlaying=S.spotPlaying;
    const pi=S.spotPlaying?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5v14l11-7z"/>';
    setHTML('spPlayIco',pi);setHTML('spFsIco',pi);
  }
  updProg();
}
function setEl(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function setSrc(id,v){const e=document.getElementById(id);if(e)e.src=v;}
function setHTML(id,v){const e=document.getElementById(id);if(e)e.innerHTML=v;}

function updProg(){
  // Add elapsed time since last poll for smoother display
  const elapsed=S.spotPlaying&&S._pollTime?(Date.now()-S._pollTime):0;
  const pos=Math.min(S.spotPos+elapsed,S.spotDur);
  const pct=S.spotDur>0?pos/S.spotDur*100:0;
  ['spProgFill','fsFill'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.width=pct+'%';});
  setEl('spPos',fmtMs(pos));setEl('spDur',fmtMs(S.spotDur));
  setEl('fsPos',fmtMs(pos));setEl('fsDur',fmtMs(S.spotDur));
}

async function spToggle(){
  await spFetch(S.spotPlaying?'/me/player/pause':'/me/player/play','PUT');
  // Wait then read actual state from Spotify instead of guessing
  setTimeout(async()=>{
    const d=await spFetch('/me/player');if(!d)return;
    S.spotPlaying=d.is_playing;
    S.spotPos=d.progress_ms||0;S._pollTime=Date.now();
    const pi=S.spotPlaying?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5v14l11-7z"/>';
    setHTML('spPlayIco',pi);setHTML('spFsIco',pi);
    updProg();
  },400);
}

function renderGrid(items,type){
  const c=document.getElementById('spContent');c.innerHTML='';
  if(!items||!items.length){c.innerHTML='<div class="sp-empty">No results found</div>';return;}
  const title=document.createElement('div');title.className='sp-section-title';
  const list=document.createElement('div');list.className='sp-list';
  items.forEach(it=>{
    const track=type==='track'?it:it.track||it;if(!track||!track.name)return;
    const dur=track.duration_ms?fmtMs(track.duration_ms):'';
    const art=track.album?.images?.[1]?.url||track.album?.images?.[0]?.url||'';
    const div=document.createElement('div');div.className='sp-list-item';
    div.innerHTML=`<img src="${art}" alt=""><div class="sp-list-info"><div class="sp-list-name">${track.name}</div><div class="sp-list-sub">${track.artists?.map(a=>a.name).join(', ')||''}</div></div><div class="sp-list-dur">${dur}</div>`;
    div.onclick=()=>playTrack(track.uri);
    list.appendChild(div);
  });
  c.appendChild(title);c.appendChild(list);
  return title;
}

async function loadTopTracks(){
  const c=document.getElementById('spContent');
  c.innerHTML='<div class="sp-empty">Loading...</div>';
  // Load everything in parallel
  const [plRes,savedRes,recentRes,artistsRes]=await Promise.all([
    spFetch('/me/playlists?limit=50'),
    spFetch('/me/albums?limit=50'),
    spFetch('/me/player/recently-played?limit=20'),
    spFetch('/me/following?type=artist&limit=50')
  ]);
  c.innerHTML='';

  function makeGrid(title, items){
    if(!items||!items.length)return;
    const t=document.createElement('div');t.className='sp-section-title';t.textContent=title;
    const g=document.createElement('div');g.className='sp-art-grid';
    items.forEach(({art,name,sub,fn})=>{
      const div=document.createElement('div');div.className='sp-art-card';
      const img=document.createElement('img');
      img.src=art||'';img.alt=name;
      img.onerror=()=>{img.style.background='var(--btn-bg)';img.removeAttribute('src');};
      const nm=document.createElement('div');nm.className='sp-card-name';nm.textContent=name;
      const sb=document.createElement('div');sb.className='sp-card-sub';sb.textContent=sub||'';
      div.appendChild(img);div.appendChild(nm);div.appendChild(sb);
      div.onclick=fn;
      g.appendChild(div);
    });
    c.appendChild(t);c.appendChild(g);
  }

  // RECENTLY PLAYED
  const recentAlbums=[];const seenRecent=new Set();
  (recentRes?.items||[]).forEach(i=>{
    const al=i.track?.album;
    if(al&&!seenRecent.has(al.id)){seenRecent.add(al.id);recentAlbums.push(al);}
  });
  makeGrid('RECENTLY PLAYED', recentAlbums.slice(0,12).map(al=>({
    art:al.images?.[0]?.url||'',name:al.name,
    sub:'Album • '+( al.artists?.[0]?.name||''),
    fn:()=>loadAlbumTracks(al.id,al.name,al.images)
  })));

  // SAVED ALBUMS
  const savedAlbums=(savedRes?.items||[]).map(i=>i.album).filter(Boolean);
  makeGrid('FAVORITES', savedAlbums.map(al=>({
    art:al.images?.[0]?.url||'',name:al.name,
    sub:(al.album_type||'Album')+' • '+(al.artists?.[0]?.name||''),
    fn:()=>loadAlbumTracks(al.id,al.name,al.images)
  })));

  // PLAYLISTS
  const playlists=(plRes?.items||[]).filter(Boolean);
  makeGrid('PLAYLISTS', playlists.map(pl=>({
    art:pl.images?.[0]?.url||'',name:pl.name,
    sub:'Playlist • '+(pl.owner?.display_name||''),
    fn:()=>loadPlaylistTracks(pl.id,pl.name)
  })));

  // ARTISTS
  const artists=(artistsRes?.artists?.items||[]).filter(Boolean);
  makeGrid('ARTISTS', artists.map(ar=>({
    art:ar.images?.[0]?.url||'',name:ar.name,
    sub:'Artist',
    fn:()=>loadArtistTopTracks(ar.id,ar.name)
  })));
}

async function loadPlaylistTracks(id,name){
  const c=document.getElementById('spContent');
  c.innerHTML='<div class="sp-empty">Loading...</div>';
  // Liked Songs special case
  if(name==='Liked Songs'){
    const d=await spFetch('/me/tracks?limit=50');
    const items=(d?.items||[]).map(i=>i?.track).filter(t=>t&&t.name&&t.uri);
    if(items.length){renderTrackList(items,name,'&#8592; Back',loadTopTracks);return;}
  }
  // Try playlist object first (100 tracks)
  const d=await spFetch('/playlists/'+id+'?market=GB');
  if(d?.tracks?.items?.length){
    const items=d.tracks.items.map(i=>i?.track).filter(t=>t&&t.name&&t.uri);
    if(items.length){renderTrackList(items,name,'&#8592; Back',loadTopTracks);return;}
  }
  // Try tracks endpoint
  const d2=await spFetch('/playlists/'+id+'/tracks?limit=50&market=GB');
  if(d2?.items?.length){
    const items2=d2.items.map(i=>i?.track).filter(t=>t&&t.name&&t.uri);
    if(items2.length){renderTrackList(items2,name,'&#8592; Back',loadTopTracks);return;}
  }
  // Search fallback
  const d3=await spFetch('/search?q='+encodeURIComponent(name)+'&type=track&limit=10&market=GB');
  const items3=(d3?.tracks?.items||[]).filter(t=>t&&t.name&&t.uri);
  if(items3.length){renderTrackList(items3,name,'&#8592; Back',loadTopTracks);return;}
  c.innerHTML='<div style="padding:30px;text-align:center;color:var(--subtext);font-size:13px;line-height:1.6;">Cannot load playlist in Spotify dev mode.<br><br><b style="color:var(--text);">Fix:</b> Go to Spotify Developer Dashboard<br>→ Request Extended Quota access</div>';
}

async function loadAlbumTracks(id,name,images){
  const c=document.getElementById('spContent');
  c.innerHTML='<div class="sp-empty">Loading...</div>';
  const d=await spFetch('/albums/'+id+'?market=GB');
  const albumFull=d;
  const tracks=(d?.tracks?.items||[]).map(t=>({
    ...t,
    album:{id,name,images:albumFull?.images||images||[]}
  }));
  renderTrackList(tracks,name,'&#8592; Back',loadTopTracks);
}

async function loadArtistTopTracks(id,name){
  const c=document.getElementById('spContent');
  c.innerHTML='<div class="sp-empty">Loading...</div>';
  const q=encodeURIComponent(name);
  const d=await spFetch('/search?q='+q+'&type=track&limit=10&market=GB');
  let tracks=(d?.tracks?.items||[]).filter(t=>t&&t.name&&t.uri&&
    t.artists?.some(a=>a.name.toLowerCase().includes(name.toLowerCase())||name.toLowerCase().includes(a.name.toLowerCase())));
  if(!tracks.length){
    tracks=(d?.tracks?.items||[]).filter(t=>t&&t.name&&t.uri);
  }
  if(!tracks.length){c.innerHTML='<div class="sp-empty">No tracks found</div>';return;}
  renderTrackList(tracks,name,'&#8592; Back',loadTopTracks);
}

function renderTrackList(items,title,backLabel,backFn){
  const c=document.getElementById('spContent');c.innerHTML='';
  const back=document.createElement('div');back.className='sp-section-title';
  back.style.cursor='pointer';back.innerHTML=backLabel||title;
  if(backFn)back.onclick=backFn;
  const list=document.createElement('div');list.className='sp-list';
  items.forEach(it=>{
    if(!it?.name)return;
    const art=it.album?.images?.[1]?.url||it.album?.images?.[0]?.url||'';
    const div=document.createElement('div');div.className='sp-list-item';
    div.innerHTML='<img src="'+art+'" alt=""><div class="sp-list-info"><div class="sp-list-name">'+it.name+'</div><div class="sp-list-sub">'+(it.artists?.map(a=>a.name).join(', ')||'')+'</div></div>'+(it.duration_ms?'<div class="sp-list-dur">'+fmtMs(it.duration_ms)+'</div>':'');
    const td={name:it.name,artist:it.artists?.map(a=>a.name).join(', ')||'',art:it.album?.images?.[0]?.url||''};
    div.onclick=(e)=>{e.stopPropagation();playTrack(it.uri,td);};
    list.appendChild(div);
  });
  c.appendChild(back);c.appendChild(list);
}

async function spSearch(){
  const q=document.getElementById('spSearchInp').value.trim();
  if(!q){loadTopTracks();return;}
  const c=document.getElementById('spContent');
  c.innerHTML='<div style="padding:20px;color:var(--subtext);">Searching...</div>';
  const d=await spFetch('/search?q='+encodeURIComponent(q)+'&type=track,album,playlist&limit=20');
  console.log('Search raw:',d,'status:',d===null?'null':'ok','tracks:',d?.tracks?.items?.length,'albums:',d?.albums?.items?.length);
  if(!d){c.innerHTML='<div style="padding:20px;color:var(--subtext);">No results</div>';return;}
  c.innerHTML='';

  const albums=(d.albums?.items||[]).filter(a=>a&&a.name);
  const playlists=(d.playlists?.items||[]).filter(p=>p&&p.name);
  const tracks=(d.tracks?.items||[]).filter(t=>t&&t.name&&t.uri);

  if(albums.length){
    const t=document.createElement('div');t.className='sp-section-title';t.textContent='ALBUMS';c.appendChild(t);
    const g=document.createElement('div');g.className='sp-art-grid';
    albums.forEach(al=>{
      const div=document.createElement('div');div.className='sp-art-card';
      const img=document.createElement('img');img.src=al.images?.[0]?.url||'';img.alt=al.name;
      img.onerror=()=>{img.style.background='var(--btn-bg)';img.removeAttribute('src');};
      div.appendChild(img);
      div.onclick=()=>loadAlbumTracks(al.id,al.name,al.images);
      g.appendChild(div);
    });
    c.appendChild(g);
  }

  if(playlists.length){
    const t=document.createElement('div');t.className='sp-section-title';t.textContent='PLAYLISTS';c.appendChild(t);
    const g=document.createElement('div');g.className='sp-art-grid';
    playlists.forEach(pl=>{
      const div=document.createElement('div');div.className='sp-art-card';
      const img=document.createElement('img');img.src=pl.images?.[0]?.url||'';img.alt=pl.name;
      img.onerror=()=>{img.style.background='var(--btn-bg)';img.removeAttribute('src');};
      div.appendChild(img);
      div.onclick=()=>loadPlaylistTracks(pl.id,pl.name);
      g.appendChild(div);
    });
    c.appendChild(g);
  }

  if(tracks.length){
    const t=document.createElement('div');t.className='sp-section-title';t.textContent='TRACKS';c.appendChild(t);
    const list=document.createElement('div');list.className='sp-list';
    tracks.forEach(it=>{
      const art=it.album?.images?.[1]?.url||it.album?.images?.[0]?.url||'';
      const div=document.createElement('div');div.className='sp-list-item';
      div.innerHTML='<img src="'+art+'" alt=""><div class="sp-list-info"><div class="sp-list-name">'+it.name+'</div><div class="sp-list-sub">'+(it.artists?.map(a=>a.name).join(', ')||'')+'</div></div><div class="sp-list-dur">'+fmtMs(it.duration_ms)+'</div>';
      const td={name:it.name,artist:it.artists?.map(a=>a.name).join(', ')||'',art:it.album?.images?.[0]?.url||''};
      div.onclick=(e)=>{e.stopPropagation();playTrack(it.uri,td);};
      list.appendChild(div);
    });
    c.appendChild(list);
  }

  if(!albums.length&&!playlists.length&&!tracks.length)
    c.innerHTML='<div style="padding:20px;color:var(--subtext);font-size:13px;">No results for "'+q+'"</div>';
}

async function playTrack(uri, td){
  // Try Web API first
  await spFetch('/me/player/play','PUT',{uris:[uri]});
  setTimeout(async()=>{
    const d=await spFetch('/me/player');
    if(d){
      S.spotPlaying=d.is_playing;S.spotDur=d.item?.duration_ms||0;S.spotPos=d.progress_ms||0;S._pollTime=Date.now();
      const it=d.item;
      if(it){
        const name=it.name||'--',artist=it.artists?.map(a=>a.name).join(', ')||'--',art=it.album?.images?.[0]?.url||'';
        setEl('spTrack',name);setEl('spArtist',artist);setEl('fsTrack',name);setEl('fsArtist',artist);
        if(art){setSrc('spArt',art);setSrc('fsArt',art);if(document.getElementById('spFs').classList.contains('open'))applyArtTint(art);}
        const pi=S.spotPlaying?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5v14l11-7z"/>';
        setHTML('spPlayIco',pi);setHTML('spFsIco',pi);updProg();
        return;
      }
    }
    // Fallback: open track directly in Spotify app via URI scheme
    if(td){
      setEl('spTrack',td.name||'--');setEl('spArtist',td.artist||'--');
      setEl('fsTrack',td.name||'--');setEl('fsArtist',td.artist||'--');
      if(td.art){setSrc('spArt',td.art);setSrc('fsArt',td.art);if(document.getElementById('spFs').classList.contains('open'))applyArtTint(td.art);}
    }
    // Open in Spotify app
    window.location.href=uri;
  },700);
}

function openFs(){
  document.getElementById('spFs').classList.add('open');
  applyArtTint(document.getElementById('spArt').src);
}

function applyArtTint(src){
  const fs=document.getElementById('spFs');
  const dark=document.body.classList.contains('dark');
  const baseR=dark?[18,18,18]:[240,236,232];
  // Always set fully opaque solid first
  fs.style.background=`rgb(${baseR.join(',')})`;
  if(!src)return;
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=c.height=16;

function resizeCv(){const w=document.getElementById('roadWrap');cv.width=w.offsetWidth;cv.height=w.offsetHeight;}
function renderRoad(){
  const W=cv.width,H=cv.height;if(!W||!H){requestAnimationFrame(renderRoad);return;}
  const dark=document.body.classList.contains('dark');
  ctx.clearRect(0,0,W,H);const spd=S.dispSpd;
  const accel=(S.targetSpd-S.prevSpd)>5,danger=spd>70||accel;
  if(accel){fogA=0.85;fogR=220;fogG=20;fogB=20;}
  else if(danger){fogA+=(0.55-fogA)*0.12;fogR+=(220-fogR)*0.15;fogG+=(20-fogG)*0.15;fogB+=(20-fogB)*0.15;}
  else if(spd>4){fogA+=(0.18-fogA)*0.05;fogR+=(30-fogR)*0.06;fogG+=(200-fogG)*0.06;fogB+=(80-fogB)*0.06;}
  else{fogA+=(0-fogA)*0.05;}
  const r=Math.round(fogR),g=Math.round(fogG),b=Math.round(fogB);
  const cl=document.getElementById('cluster');
  if(cl){if(fogA>0.01)cl.style.background=`linear-gradient(to bottom,rgba(${r},${g},${b},${(fogA*0.45).toFixed(3)}) 0%,rgba(${r},${g},${b},${(fogA*0.25).toFixed(3)}) 40%,rgba(${r},${g},${b},0.02) 100%)`;else cl.style.background=dark?'#111':'#ebebeb';}
  if(fogA>0.005){const fg=ctx.createRadialGradient(W/2,H*0.65,0,W/2,H*0.65,H*0.6);fg.addColorStop(0,`rgba(${r},${g},${b},${(fogA*0.6).toFixed(3)})`);fg.addColorStop(1,`rgba(${r},${g},${b},0)`);ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);}
  const ltx=W*0.36,lbx=W*0.04,rtx=W*0.64,rbx=W*0.96,ty=H*0.08,by=H;
  if(spd>0)laneOff=(laneOff+spd*0.0008)%1.0;
  for(let i=0;i<32;i++){const t=((i/32)+laneOff)%1.0,t2=(((i+1)/32)+laneOff)%1.0;const lx1=ltx+(lbx-ltx)*t,ly1=ty+(by-ty)*t,lx2=ltx+(lbx-ltx)*t2,ly2=ty+(by-ty)*t2;const rx1=rtx+(rbx-rtx)*t,ry1=ty+(by-ty)*t,rx2=rtx+(rbx-rtx)*t2,ry2=ty+(by-ty)*t2;const op=Math.pow(t,0.5)*0.88,lw=0.6+t*2.8;ctx.strokeStyle=`rgba(33,150,243,${op})`;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lx1,ly1);ctx.lineTo(lx2,ly2);ctx.stroke();ctx.beginPath();ctx.moveTo(rx1,ry1);ctx.lineTo(rx2,ry2);ctx.stroke();}
  if(spd>0)dotOff=(dotOff+spd*0.08)%60;
  ctx.setLineDash([18,14]);ctx.lineDashOffset=-dotOff;ctx.strokeStyle=dark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(W/2,ty);ctx.lineTo(W/2,by);ctx.stroke();ctx.setLineDash([]);
  const carW=W*0.58,ni=getNightImg();
  if(ni.complete&&ni.naturalWidth>0){const ch=carW*(ni.naturalHeight/ni.naturalWidth);const cx2=(W-carW)/2,baseY=H-ch-H*0.02;if(spd>2){glideT+=0.0012;const bobY=-Math.abs(Math.sin(glideT))*6,swayX=Math.sin(glideT*0.35)*3;ctx.drawImage(ni,cx2+swayX,baseY+bobY,carW,ch);}else ctx.drawImage(ni,cx2,baseY,carW,ch);}
  requestAnimationFrame(renderRoad);
}

window.addEventListener('load',()=>{
  resizeCv();window.addEventListener('resize',resizeCv);
  renderRoad();refreshUI();
  const _sp=new URLSearchParams(window.location.search);
  if(_sp.get('code')){handleCb(_sp.get('code'));}
  else{
    // v3 = version flag, clears token if scopes updated
    if(localStorage.getItem('sp_ver')!=='v4'){
      localStorage.removeItem('sp_tok');localStorage.removeItem('sp_tok_exp');
      localStorage.removeItem('sp_scopes');localStorage.removeItem('sp_ref');
      localStorage.removeItem('sp_v');
    }
    const t=localStorage.getItem('sp_tok'),e=localStorage.getItem('sp_tok_exp');
    if(t&&e&&Date.now()<parseInt(e)){S.spotToken=t;initSpot();}
  }
  setInterval(updProg,500);
  if(location.search.includes('demo'))startDemo();
  else if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(pos=>{onGPS(pos);navigator.geolocation.watchPosition(onGPS,err=>console.warn('GPS:',err.message),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});},err=>console.warn('GPS denied:',err.message),{enableHighAccuracy:true,timeout:20000});
  }
});
